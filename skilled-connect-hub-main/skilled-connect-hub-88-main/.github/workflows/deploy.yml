
name: Deploy Skilled Connect Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skilled-connect-hub-main/skilled-connect-hub-88-main/package-lock.json

      - name: Install dependencies
        working-directory: skilled-connect-hub-main/skilled-connect-hub-88-main
        run: npm install

      - name: Build
        working-directory: skilled-connect-hub-main/skilled-connect-hub-88-main
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: skilled-connect-hub-main/skilled-connect-hub-88-main/.output/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4